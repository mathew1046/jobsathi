---
scan_execution_policy:
  - name: Scan all branches
    description: Execute security scans on all branches
    enabled: true
    rules:
      - type: pipeline
        branches:
          - "*"
    actions:
      - scan: sast
      - scan: secret_detection
      - scan: dependency_scanning
      - scan: container_scanning

scan_result_policy:
  - name: Block critical vulnerabilities
    description: Block merge if critical vulnerabilities found
    enabled: true
    rules:
      - type: scan_finding
        branches:
          - main
        scanners:
          - sast
          - dependency_scanning
        severity_levels:
          - critical
        vulnerability_states:
          - detected
    actions:
      - type: require_approval
        approvals_required: 2
