stages:
  - security
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  SECURE_ANALYZERS_PREFIX: "registry.gitlab.com/security-products"

# ==================== SECURITY SCANNING ====================

# 1. Secret Detection - Scan for exposed API keys
secret_detection:
  stage: security
  image: 
    name: "registry.gitlab.com/security-products/secrets:latest"
    entrypoint: [""]
  script:
    - /analyzer run
  allow_failure: true
  only:
    - branches
    - merge_requests

# 2. SAST (Static Application Security Testing) - Python
sast:
  stage: security
  image: python:3.12
  script:
    - pip install bandit safety
    - bandit -r backend/app/ -f json -o bandit-report.json || true
    - safety check --json > safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
  allow_failure: true

# 3. Dependency Scanning - Python & Node.js
dependency_scanning:
  stage: security
  image: python:3.12
  before_script:
    - apt-get update && apt-get install -y nodejs npm
  script:
    # Python dependencies
    - pip install safety
    - safety check --file backend/app/requirements.txt --json > python-deps.json || true
    # Node.js dependencies
    - cd frontend && npm audit --json > ../npm-audit.json || true
  artifacts:
    paths:
      - python-deps.json
      - npm-audit.json
    expire_in: 1 week
  allow_failure: true

# 4. Container Scanning - Scan Docker images
container_scanning:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  variables:
    TRIVY_TIMEOUT: "10m"
  script:
    - docker build -t jobsathi-backend:$CI_COMMIT_SHA .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -e TRIVY_TIMEOUT=$TRIVY_TIMEOUT aquasec/trivy image --timeout $TRIVY_TIMEOUT jobsathi-backend:$CI_COMMIT_SHA
  allow_failure: true
  only:
    - main
    - merge_requests

# 5. License Scanning
license_scanning:
  stage: security
  image: python:3.12
  script:
    - pip install pip-licenses
    - pip-licenses --format=json --output-file=licenses.json
  artifacts:
    paths:
      - licenses.json
    expire_in: 1 week

# ==================== TESTING ====================

test_backend:
  stage: test
  image: python:3.12
  before_script:
    - cd backend/app
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - pytest --cov=. --cov-report=xml --cov-report=html || true
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/app/coverage.xml
    paths:
      - backend/app/htmlcov/
    expire_in: 1 week
  allow_failure: true

test_frontend:
  stage: test
  image: node:18
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint || true
    - npm run test || true
  artifacts:
    paths:
      - frontend/coverage/
    expire_in: 1 week
  allow_failure: true

# ==================== BUILD ====================

build_backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main
    - tags

build_frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main
    - tags

# ==================== DEPLOY ====================

deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose -f docker-compose.yml up -d
  environment:
    name: staging
    url: http://staging.jobsathi.example.com
  only:
    - main
  when: manual

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose -f docker-compose.yml up -d
  environment:
    name: production
    url: http://jobsathi.example.com
  when: manual
  only:
    - tags
